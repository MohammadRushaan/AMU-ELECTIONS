<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Grievance Control Desk | Syed Arif Ali Campaign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-['Plus_Jakarta_Sans'] min-h-screen p-4 sm:p-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Top Admin Header -->
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-xl">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs font-mono font-bold text-amber-400 uppercase tracking-widest">Internal Campaign Ops</span>
        </div>
        <h1 class="text-2xl font-black text-white mt-1">Grievance Command Desk</h1>
        <p class="text-xs text-slate-400">Syed Arif Ali • AMU Court Candidate (Ballot No. 03)</p>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl border border-slate-700 flex items-center gap-1.5 transition">
          📥 Export CSV
        </button>
        <button onclick="logoutAdmin()" class="bg-red-500/20 hover:bg-red-500/30 text-red-300 text-xs font-bold px-3.5 py-2 rounded-xl border border-red-500/30 transition">
          Lock Desk
        </button>
      </div>
    </header>

    <!-- Filters & Search Bar -->
    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[11px]">Filter Status:</span>
        <button onclick="filterBy('all')" class="status-tab px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold">All</button>
        <button onclick="filterBy('Scheduled')" class="status-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700">⏳ Scheduled</button>
        <button onclick="filterBy('Raised to Authorities')" class="status-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700">🏛️ Raised to Authorities</button>
        <button onclick="filterBy('Resolved')" class="status-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700">✓ Resolved</button>
      </div>

      <div class="text-slate-400 font-mono" id="counterSummary">
        Loading tickets...
      </div>
    </div>

    <!-- Grievances Container Grid -->
    <div id="grievanceGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full text-center py-12 text-slate-500 font-mono text-sm">Authenticating session...</div>
    </div>

  </div>

  <script>
    const BACKEND_URL = "https://amu-elections.onrender.com";
    let adminKey = sessionStorage.getItem('COURT_ADMIN_KEY');
    let allRecords = [];
    let activeFilter = 'all';

    // Verify Passkey
    // 1. Strict Server-Side Key Verification (Blocks wrong passkeys immediately)
    async function verifyAndLogin() {
      // If no key in session, prompt the user
      if (!adminKey) {
        adminKey = prompt("Enter Campaign Operations Passkey:");
      }

      if (!adminKey) {
        blockAccess("Passkey required to access admin operations.");
        return;
      }

      // Check passkey against backend before showing anything
      try {
        const verifyRes = await fetch(`${BACKEND_URL}/api/admin/verify`, {
          headers: { 'x-admin-key': adminKey }
        });

        if (verifyRes.status === 401 || !verifyRes.ok) {
          sessionStorage.removeItem('COURT_ADMIN_KEY');
          adminKey = null;
          blockAccess("Invalid Passkey. Access Denied.");
          return;
        }

        // Passed: Key is confirmed by server
        sessionStorage.setItem('COURT_ADMIN_KEY', adminKey);
        await loadAdminData();

      } catch (err) {
        blockAccess("Could not connect to backend. Please wake up Render container.");
      }
    }

    // 2. Lockout screen if wrong key is entered
    function blockAccess(message) {
      document.getElementById('grievanceGrid').innerHTML = `
        <div class="col-span-full bg-red-950/60 border border-red-800 text-red-200 p-8 rounded-2xl text-center space-y-4">
          <div class="text-3xl">🔒</div>
          <div class="font-bold text-base font-mono">${message}</div>
          <button onclick="retryLogin()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl transition">
            Enter Passkey Again
          </button>
        </div>
      `;
      document.getElementById('counterSummary').innerText = 'Access Restricted';
    }

    function retryLogin() {
      sessionStorage.removeItem('COURT_ADMIN_KEY');
      adminKey = null;
      verifyAndLogin();
    }

    function logoutAdmin() {
      sessionStorage.removeItem('COURT_ADMIN_KEY');
      location.reload();
    }

    // 3. Fetch Data only after server verification succeeds
    async function loadAdminData() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/grievances/admin-all`, {
          headers: { 'x-admin-key': adminKey }
        });

        if (res.status === 401) {
          blockAccess("Session expired or unauthorized key.");
          return;
        }

        allRecords = await res.json();
        renderAdminCards();
      } catch (err) {
        blockAccess("Failed to fetch grievances from server.");
      }
    }

    function filterBy(status) {
      activeFilter = status;
      document.querySelectorAll('.status-tab').forEach(b => {
        b.className = 'status-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700';
      });
      event.target.className = 'status-tab px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold';
      renderAdminCards();
    }

    function renderAdminCards() {
      const grid = document.getElementById('grievanceGrid');
      grid.innerHTML = '';

      const filtered = allRecords.filter(r => {
        if (activeFilter === 'all') return true;
        return (r.status || '').toLowerCase().includes(activeFilter.toLowerCase());
      });

      document.getElementById('counterSummary').innerText = `Showing ${filtered.length} of ${allRecords.length} records`;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 font-mono text-sm">No issues found in this category.</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-slate-950 border border-slate-800 rounded-2xl p-4 sm:p-5 flex flex-col justify-between space-y-4 hover:border-slate-700 transition";

        // WhatsApp direct link generator
        const rawPhone = (item.contact || '').replace(/[^0-9]/g, '');
        const waLink = rawPhone ? `https://wa.me/91${rawPhone.slice(-10)}?text=${encodeURIComponent(`Salam, regarding your issue ${item.ticket_id} submitted to Syed Arif Ali's Court Docket:`)}` : null;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <div>
              <span class="font-mono text-amber-400 font-bold text-sm tracking-wider">${item.ticket_id}</span>
              <span class="text-xs text-slate-400 ml-2">${item.stream} • ${item.branch} • ${item.hall}</span>
            </div>
            <button onclick="deleteTicket('${item.ticket_id}')" class="text-red-400 hover:text-red-300 text-xs font-mono">Delete</button>
          </div>

          <p class="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-800 leading-relaxed">${item.description}</p>

          <div class="space-y-2 pt-2 border-t border-slate-800">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="text-[11px] text-slate-400 font-mono">Status:</span>
              <select id="status-${item.ticket_id}" class="bg-slate-900 border border-slate-700 text-white rounded-lg px-2.5 py-1 text-xs focus:ring-1 focus:ring-amber-400 outline-none">
                <option value="Issue Raised" ${item.status === 'Issue Raised' ? 'selected' : ''}>📌 Issue Raised</option>
                <option value="Under Review" ${item.status === 'Under Review' ? 'selected' : ''}>🔍 Under Review</option>
                <option value="Raised to Authorities" ${item.status === 'Raised to Authorities' ? 'selected' : ''}>🏛️ Raised to Authorities</option>
                <option value="Redressed & Resolved" ${item.status === 'Redressed & Resolved' ? 'selected' : ''}>✓ Redressed &amp; Resolved</option>
              </select>
            </div>

            <div class="flex items-center gap-2">
              <input type="url" id="proof-${item.ticket_id}" value="${item.proof_url || ''}" placeholder="Paste proof photo/drive/file link..." class="flex-1 bg-slate-900 border border-slate-700 text-slate-200 placeholder-slate-500 rounded-lg px-2.5 py-1 text-xs outline-none focus:border-amber-400">
              <button onclick="saveTicketUpdate('${item.ticket_id}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-1 rounded-lg transition whitespace-nowrap">
                Save
              </button>
            </div>
            ${item.proof_url ? `<a href="${item.proof_url}" target="_blank" class="inline-block text-[10px] text-emerald-400 hover:underline font-mono">✓ Current Proof Attached ↗</a>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function updateTicketStatus(ticketId, newStatus) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/grievances/${ticketId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': adminKey
          },
          body: JSON.stringify({ status: newStatus })
        });
        if (!res.ok) throw new Error();
        const updated = await res.json();
        
        // Update local state
        const target = allRecords.find(r => r.ticket_id === ticketId);
        if (target) target.status = updated.status;
        renderAdminCards();
      } catch (err) {
        alert('Failed to update ticket status. Check credentials and server status.');
      }
    }

    async function deleteTicket(ticketId) {
      if (!confirm(`Are you sure you want to delete ticket ${ticketId}? This action is irreversible.`)) return;
      try {
        const res = await fetch(`${BACKEND_URL}/api/grievances/${ticketId}`, {
          method: 'DELETE',
          headers: { 'x-admin-key': adminKey }
        });
        if (!res.ok) throw new Error();
        allRecords = allRecords.filter(r => r.ticket_id !== ticketId);
        renderAdminCards();
      } catch (err) {
        alert('Failed to delete ticket.');
      }
    }

    async function saveTicketUpdate(ticket_id) {
      const statusEl = document.getElementById(`status-${ticket_id}`);
      const proofEl = document.getElementById(`proof-${ticket_id}`);

      const status = statusEl ? statusEl.value : 'Issue Raised';
      const proof_url = proofEl ? proofEl.value.trim() : '';

      try {
        const res = await fetch(`${BACKEND_URL}/api/grievances/${ticket_id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': adminKey
          },
          body: JSON.stringify({ status, proof_url })
        });

        if (!res.ok) {
          alert('Failed to update ticket. Check authorization.');
          return;
        }

        await loadAdminData();
      } catch (err) {
        alert('Server communication error.');
      }
    }

    function exportCSV() {
      if (!allRecords.length) return alert('No data to export.');
      let csv = 'Ticket ID,Stream,Branch,Hall,Category,Description,Contact,Status,Date\n';
      allRecords.forEach(r => {
        csv += `"${r.ticket_id}","${r.stream}","${r.branch}","${r.hall}","${r.category}","${(r.description || '').replace(/"/g, '""')}","${r.contact || ''}","${r.status}","${r.created_at}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AMU_Grievances_Export_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    document.addEventListener('DOMContentLoaded', verifyAndLogin);
  </script>
</body>
</html>
